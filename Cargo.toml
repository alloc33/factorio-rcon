[package]
name = "factorio-rcon"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Async RCON client for Factorio with proper multi-packet response handling"
keywords = ["factorio", "rcon", "async", "gaming"]
categories = ["network-programming", "asynchronous", "games"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "macros"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
